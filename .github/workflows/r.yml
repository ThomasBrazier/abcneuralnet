name: R

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-13
    strategy:
      matrix:
        r-version: ['4.2.3']
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    
    steps:
      - uses: actions/checkout@v4
      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@f57f1301a053485946083d7a45022b278929a78a
        with:
          r-version: ${{ matrix.r-version }}
      - name: Install pandoc
        uses: pandoc/actions/setup@v1
      - name: Install dependencies
        run: |
          install.packages(c("Matrix", "MatrixModels", "mvtnorm"), type = "binary")
          install.packages(c("remotes", "rcmdcheck", "quantreg", "car", "abc", "ggpubr", "luz", "plotly", "tabnet", "R6", "RColorBrewer", "Rdpack", "knitr", "bundle", "dplyr", "ggplot2", "innsight", "janitor", "tibble", "tidyverse", "torch", "devtools", "assertthat", "here"))
          remotes::install_deps(dependencies = TRUE)
          torch::install_torch()
        shell: Rscript {0}
      - name: Check
        run: rcmdcheck::rcmdcheck(args = "--no-manual --no-build-vignettes --ignore-vignettes", build_args = "--no-manual --no-build-vignettes --ignore-vignettes", error_on = "error")
        shell: Rscript {0}
